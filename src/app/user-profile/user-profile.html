<h1>{{ titulo }}</h1>

<div class="comp-user">
  <p class="name">Nombre: {{ nombre }}</p>
  <p class="role">Rol: {{ rol }}</p>
</div>

<h1 [innerHTML]="titulo"></h1>
<input type="text" [value]="nombre" />

<img src="{{ imagen }}" alt="imagen" />

<p [class] = "naranja">Hola, buenas tardes! Mi nombre es Ismael</p>
<input type="checkbox" [checked] = "marcado">
<input type="text" [value]="nombre" [disabled] = "deshabilitado">
<div>
  <p>{{asignatura.nombre}}</p>
  <p>{{asignatura.codigo}}</p>
</div>
